jobs:
  run_tests:
    name: unit tests (nvim ${{ matrix.rev }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: date +%F > todays-date
      - name: Restore cache for today's nightly.
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ matrix.rev }}-${{ hashFiles('todays-date') }}
          path: _neovim
      - name: Prepare
        run: |
          test -d _neovim || {
            mkdir -p _neovim
            curl -sSL --fail "https://github.com/neovim/neovim/releases/download/${{ matrix.rev }}" | tar xzf - --strip-components=1 -C "${PWD}/_neovim"
          }
          mkdir -p ~/.local/share/nvim/site/pack/vendor/start
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
          ln -s $(pwd) ~/.local/share/nvim/site/pack/vendor/start
      - name: Run tests
        run: |
          export PATH="${PWD}/_neovim/bin:${PATH}"
          export VIM="${PWD}/_neovim/share/nvim/runtime"
          nvim --version
          make test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rev: v0.10.4/nvim-linux-x86_64.tar.gz
          - rev: v0.11.7/nvim-linux-x86_64.tar.gz
          - rev: v0.12.6/nvim-linux-x86_64.tar.gz
          - rev: nightly/nvim-linux-x86_64.tar.gz
name: Test
on:
  pull_request:
    paths:
      - "lua/**"
      - "plugin/**"
      - "scripts/**"
      - "makefile"
      - ".github/workflows/**"
  push:
    paths:
      - "lua/**"
      - "plugin/**"
      - "scripts/**"
      - "makefile"
      - ".github/workflows/**"
